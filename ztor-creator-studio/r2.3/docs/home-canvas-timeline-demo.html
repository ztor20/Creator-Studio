<script>
/* 頂列的時間與今日進帳（2026-08-31）。
   時間每分鐘更新一次，不是每秒——展示版上一個跳秒的鐘會一直把目光拉過去，
   而它其實不帶任何要讀的資訊。 */
(function () {
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  function tick() {
    var el = document.getElementById('canvas-clock');
    if (!el) return;
    var d = new Date();
    el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 60000);

  /* 日期：與時間同一列（2026-08-31 使用者裁示頂列只留日期與時間）。
     兩個語言各寫各的格式，不是同一串的逐字對譯——中文「2026 年 8 月 31 日 · 週一」，
     英文 "Mon, 31 Aug 2026"。跟著語言切換重畫。 */
  function stamp() {
    var el = document.getElementById('canvas-date');
    if (!el) return;
    var zh = (document.documentElement.lang || '').toLowerCase().indexOf('zh') === 0;
    var d = new Date();
    el.textContent = zh
      ? d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · '
        + '週' + '日一二三四五六'.charAt(d.getDay())
      : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  stamp();
  /* i18n 發的事件是 `i18n:applied`；`ztor:langchange` 站上沒有任何地方發，
     掛在它上面等於沒掛（2026-08-31 修）。 */
  document.addEventListener('i18n:applied', stamp);



  /* 問候語與儀表板同一套（名字走 persona、招呼看時段）：兩個版型講同一句話，
     不要一個說 Home 一個說「午安，周湯豪」。 */
  function greet() {
    var el = document.getElementById('canvas-greeting');
    if (!el) return;
    var api = window.ztorProjects;
    var name = api && api.displayName ? api.displayName() : '';
    var zh = (document.documentElement.lang || '').toLowerCase().indexOf('zh') === 0;
    var h = new Date().getHours();
    var hi = zh ? (h < 12 ? '早安' : h < 18 ? '午安' : '晚安')
               : (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening');
    el.textContent = name ? (zh ? hi + '，' + name : hi + ', ' + name) : hi;
  }
  greet();
  document.addEventListener('DOMContentLoaded', greet);
  document.addEventListener('i18n:applied', greet);

  /* 捲過第一屏就把底圖淡掉（2026-08-31）：底圖是 `fixed` 的——它必須滿到視窗邊
     才讀得出「這張圖是地」——所以捲動時它不會自己離開。下面那一段是一般的工作
     內容（磚列、平台表現），躺在一張人臉上讀不乾淨；淡掉之後就回到站上原本的
     星空檯面，與其他頁一致。門檻取半屏：太早會在還看得到第一屏時就開始褪，
     太晚則會讓第二段的頭幾行仍疊在圖上。 */
  /* 捲動發生在 `.main` 身上、不是視窗：站上的外殼是固定高度的玻璃殼，
     內容在面板裡自己捲（shared.css 的 `.main { overflow-y: auto }`）。
     監聽掛在 window 上永遠不會觸發（2026-08-31 實測）。 */
  var scroller = document.querySelector('.main');
  var hero = document.querySelector('.canvas-hero');
  var rail = document.querySelector('.canvas-home__rail');
  var liveSheet = document.querySelector('.canvas-sheet--live');
  var FADE = 72;   /* 左欄上緣漸消的長度 */

  /* 頂列與切換器什麼時候被推走（2026-08-31 使用者裁示兩次：先「下一段出現時，
     這兩個也一起往上滑不見」，再「**在左欄那一塊滑走之前，頂列與右側都不要動**」）：
     sticky 的元素是被**自己容器的下緣**推走的，容器若是整個第一屏，它們會釘到
     第一屏剩下最後一個元素高度時才走——而第一屏比左欄還長（左欄結束之後還有一段
     空白），所以它們會在左欄早就捲完之後還壓在畫面上。
     解法是把它們包進一個容器，讓容器的**下緣切齊左欄的下緣**：左欄還在畫面上時
     它們一動不動，左欄的底邊一碰到畫面頂端，它們就跟著滑出去。
     容器多出來的高度用等量的負下外距抵銷，底下的內容位置完全不動；容器本身
     `pointer-events: none`（它會蓋到下面的內容上），只有裡面的頂列吃事件。
     **算一次就好**：高度只跟版面有關，不跟捲動有關——所以不放進 onScroll，
     避免又走回「JS 每一幀算位移」那條會抖的老路。 */
  var stick = document.querySelector('[data-hero-stick]');
  var chrome = document.querySelector('.canvas-hero__chrome');
  var stickH = null;
  function sizeStick() {
    if (!stick || !chrome || !rail || !scroller) return;
    /* 不必先把樣式清掉再量：這一層多出來的高度已經被等量的負下外距抵銷，
       左欄與容器量到的都是它們自己的自然位置。 */
    var y = scroller.scrollTop;
    var top = stick.getBoundingClientRect().top + y;
    var bottom = rail.getBoundingClientRect().bottom + y;
    var h = Math.max(Math.round(bottom - top), chrome.offsetHeight);
    if (h === stickH) return;
    stickH = h;
    /* 這一層在版面上該佔的高度＝頂列自己的高 ＋ 頂列與工作區之間的間距。
       **那段間距要在這裡加回來**（2026-08-31 使用者回報「這兩個區域的間距要留出來」）：
       間距原本是頂列的下外距，而這一層一旦有了指定高度，子元素的下外距就不再穿透
       出來——56px 的呼吸整段消失，問候與第一格的標題會黏在一起。 */
    var bar = chrome.firstElementChild;
    var gapBelow = bar ? (parseFloat(getComputedStyle(bar).marginBottom) || 0) : 0;
    stick.style.height = h + 'px';
    stick.style.marginBottom = (chrome.offsetHeight + gapBelow - h) + 'px';
  }
  sizeStick();
  window.addEventListener('resize', sizeStick);
  window.addEventListener('load', sizeStick);
  /* 換語言／重畫之後左欄的高度會變（待辦筆數、字長都不同），第一屏跟著變高變矮。 */
  document.addEventListener('i18n:applied', function () { setTimeout(sizeStick, 0); });
  /* 第一屏的高度在載入後還會再變幾次（字型換好、圖載完、元件重畫），而它變了
     推走的時刻就跟著錯位——實測有一次算在 933、穩定後是 877，差了 56px。
     盯著它自己重算，比在每一個可能的時機各補一次呼叫可靠。 */
  if (window.ResizeObserver && rail) {
    /* 看的是左欄不是第一屏：左欄是決定第一屏高度的那一項，而第一屏的高度會被
       這支函式自己改動——盯著自己改的東西會來回觸發。 */
    new ResizeObserver(function () { sizeStick(); }).observe(rail);
  }

  function onScroll() {
    if (!scroller) return;
    var y = scroller.scrollTop;

    /* 1) 第一段快要走完時把底圖與切換器一起淡掉：它們是 `fixed`／sticky 的，
          不會自己離開，而第二段是一般的工作內容，躺在一張人臉上讀不乾淨。
          門檻改成「第一段的底邊剩下四分之一個螢幕」（2026-08-31 再調）：原本寫成
          固定的「半個螢幕」，第一段變長之後那個位置還在半路上——照片消失時左欄
          才捲到待辦事項，看起來像圖突然壞掉。 */
    var heroH = hero ? hero.offsetHeight : scroller.clientHeight;
    var fadeAt = Math.max(heroH - scroller.clientHeight * 0.25, scroller.clientHeight * 0.3);
    document.body.classList.toggle('is-past-hero', y > fadeAt);

    /* 1b) 第二段佔著畫面時，換上「正中央那一件的海報」當整個視窗的地
          （2026-08-31 使用者裁示；圖由 components.js 的輪播控制換，這裡只管開關）。
          判準是「這一段蓋住畫面的中線」：那一刻它已經是讀者在看的東西，而更早開燈
          會在第一屏還沒走完時就把地換掉。 */
    if (liveSheet) {
      var lr = liveSheet.getBoundingClientRect();
      var mid = scroller.clientHeight / 2;
      document.body.classList.toggle('is-live-bg', lr.top < mid && lr.bottom > mid);
    }

    /* 2) 右邊的作品切換器與頂列都改用 CSS sticky 釘住（2026-08-31 再調）：
          原本這裡用捲動事件即時算位移，JS 比瀏覽器的捲動繪製慢半拍所以會抖，
          而且與頂列（CSS sticky）由兩套機制驅動、離開的時機對不上。
          規則寫在 canvas-stage.css 的 `.canvas-stage__rail`，這裡不再插手。 */

    /* 3) 左欄往上捲時上緣漸消：遮罩是相對元素自己的框算的，而「畫面頂端現在切到
          這一欄的哪裡」只有捲動量知道，所以把兩個位置寫成變數餵給 CSS。
          **淡出的長度跟著捲動量長，不是固定 72**（2026-08-31 使用者回報「還沒開始
          滑就被遮住了」）：固定值在 `y = 0` 時就已經把最上面 72px 蓋掉一半，
          而那時根本還沒有東西捲出去。 */
    if (rail) {
      var fade = Math.min(y, FADE);
      rail.style.setProperty('--rail-fade-start', y + 'px');
      rail.style.setProperty('--rail-fade-end', (y + fade) + 'px');
    }
  }
  onScroll();
  if (scroller) scroller.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
})();
</script>

<!-- ════════════════════════════════════════════════════════════════════
     Demo 專用（2026-08-31）：把第二屏從「進行中」擴成一條時間線

     使用者指出「即將發生的事和進行中的事很分散」——同一件事散在三處（左欄的上線
     倒數、右邊的切換器、第二屏的進行中）。這一份 demo 把它收成一條線：

       1 第二屏＝進行中（有進度條）在前 ＋ 即將發生（只有倒數）在後
       2 左欄的「上線進行中」那一格退場（它講的正是即將發生）
       3 右邊的切換器維持原樣——它是換底圖的控制，與時態無關

     這裡的卡片是 demo 腳本另外接上去的，正式頁面（home-canvas.html）沒有動。
     要正式採用時，這段邏輯應該搬進 components.js 的 `canvas-live` 資料端，
     並把「即將發生收多遠」寫進 ASSUMPTIONS。
     ════════════════════════════════════════════════════════════════════ -->
<style>
.demo-note {
  position: fixed; z-index: 50; left: 20px; bottom: 20px; width: 300px;
  padding: 14px 16px; border-radius: var(--radius-xl);
  background: var(--ztu-glass-bg); backdrop-filter: blur(var(--ztu-blur-glass));
  border: 1px solid var(--border); box-shadow: var(--shadow-card);
  font-family: var(--font-ui); color: var(--foreground);
}
.demo-note h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; }
.demo-note ol { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.7; color: var(--muted-foreground); }
.demo-note b { color: var(--foreground); font-weight: 500; }
.demo-note__x {
  position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
  border: 0; border-radius: 50%; background: var(--ztu-film); color: var(--muted-foreground);
  cursor: pointer; font-size: 13px; line-height: 1;
}
.demo-note__x:hover { color: var(--foreground); }
.demo-note__win { margin: 10px 0 0; font-size: 11px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.demo-note__win button {
  padding: 2px 8px; border-radius: var(--radius-pill); cursor: pointer;
  border: 1px solid var(--border); background: var(--ztu-film);
  color: var(--muted-foreground); font-size: 11px; font-family: inherit;
}
.demo-note__win button.is-on { color: var(--foreground); border-color: var(--ztu-glass-rim); }
.demo-note__stat { margin: 6px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted-foreground); }
</style>

<aside class="demo-note" id="demo-note">
  <button class="demo-note__x" type="button" aria-label="關閉">×</button>
  <h2>這一份 demo 改了三件事</h2>
  <ol>
    <li>第二屏＝<b>一條時間線</b>：進行中（有進度條）在前、即將發生（只有倒數）在後</li>
    <li>左欄的「上線進行中」<b>退場</b>——它講的就是即將發生</li>
    <li>右邊的切換器<b>不動</b>：它是換底圖的控制，與時態無關</li>
  </ol>
  <p class="demo-note__win">「即將發生」收多遠
    <button type="button" data-win="30">30 天</button>
    <button type="button" data-win="90" class="is-on">90 天</button>
  </p>
  <p class="demo-note__stat" id="demo-stat"></p>
</aside>

<script>
/* 即將發生的那幾件：30 天內要上線的項目、30 天內要舉行的活動。
   卡片沿用 `.live-item` 的結構，只是把「進度條＋百分比」換成倒數——那幾件還沒開始，
   沒有進度可言，硬畫一條 0% 的軌道會讀成「賣得很差」。 */
(function () {
  /* 窗口做成可切換的（demo 專用）：**這一批示範資料在 30 天內沒有任何活動**——
     最近一場在 34 天後，所以照我原本提的 30 天，這一列會全部是項目、看不出
     「項目與活動同一條線」。90 天才看得到混排的樣子。正式要收多遠是產品決定，
     這裡把兩種都擺出來讓人比。 */
  var WINDOW_DAYS = 90;

  function zh() { return (document.documentElement.lang || '').indexOf('zh') === 0; }
  function daysTo(str) {
    var m = String(str || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    return Math.round((d - t) / 86400000);
  }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function upcoming() {
    var out = [], z = zh();
    var api = window.ztorProjects;
    if (api) api.list().forEach(function (p) {
      var img = p.poster || p.cover; if (!img) return;
      var n = daysTo(api.releaseDate ? api.releaseDate(p) : '');
      if (n == null || n < 0 || n > WINDOW_DAYS) return;
      var nm = api.nameLabel(p), lab = api.catLabel(p.cat);
      out.push({
        n: n, img: img, title: z ? nm.zh : nm.en, kind: z ? lab.zh : lab.en,
        stage: z ? '上線' : 'Release',
        value: n === 0 ? (z ? '今天上線' : 'Live today') : String(n),
        unit: n === 0 ? '' : (z ? ' 天後上線' : (n === 1 ? ' day to live' : ' days to live')),
        meta: '', go: 'project-detail.html?id=' + p.id, k: 'project'
      });
    });
    var ev = window.ztorEvents;
    if (ev) ev.list().forEach(function (e) {
      var img = e.images && e.images.keyvisual; if (!img) return;
      if (e.status !== 'scheduled') return;          /* 售票中／進行中的已經在前面那一段了 */
      var n = daysTo(e.date);
      if (n == null || n < 0 || n > WINDOW_DAYS) return;
      out.push({
        n: n, img: img, title: e.name, kind: z ? '活動' : 'Event',
        stage: z ? '準備中' : 'Scheduled',
        value: n === 0 ? (z ? '今天' : 'Today') : String(n),
        unit: n === 0 ? '' : (z ? ' 天後舉行' : (n === 1 ? ' day to go' : ' days to go')),
        meta: [e.date, e.city].filter(Boolean).join(' \u00b7 '),
        go: 'event-detail.html?id=' + e.id, k: 'event'
      });
    });
    /* 近的排前面：這一段是時間線，順序就是它唯一的資訊。 */
    return out.sort(function (a, b) { return a.n - b.n; });
  }

  function card(r) {
    return '<a class="card live-item" data-live-kind="' + r.k + '" data-demo-upcoming href="' + esc(r.go) + '">'
      + '<span class="live-item__poster"><img src="' + esc(r.img) + '" alt="" loading="lazy"></span>'
      + '<span class="live-item__body">'
      +   '<span class="live-item__top">'
      +     '<span class="live-item__stage">' + esc(r.stage) + '</span>'
      +     '<span class="live-item__kind">' + esc(r.kind) + '</span>'
      +   '</span>'
      +   '<span class="live-item__name">' + esc(r.title) + '</span>'
      +   (r.meta ? '<span class="live-item__meta">' + esc(r.meta) + '</span>' : '')
      +   '<span class="live-item__status">'
      +     '<span class="live-item__value-row"><span class="live-item__value">' + esc(r.value)
      +       (r.unit ? '<span class="live-item__den">' + esc(r.unit) + '</span>' : '') + '</span></span>'
      +     '<span class="btn btn--outline btn--sm live-item__go">'
      +       '<span data-i18n="canvas.open">前往</span>'
      +       '<i data-lucide="chevron-right" class="ztor-icon" aria-hidden="true"></i>'
      +     '</span>'
      +   '</span>'
      + '</span></a>';
  }

  function fill() {
    var rail = document.querySelector('[data-live-rail]');
    if (!rail) return;
    Array.prototype.forEach.call(rail.querySelectorAll('[data-demo-upcoming]'), function (n) { n.remove(); });
    var rows = upcoming();
    var stat0 = document.getElementById('demo-stat');
    if (!rows.length) {
      if (stat0) stat0.textContent = WINDOW_DAYS + ' 天內沒有即將發生的事。';
      return;
    }
    rail.insertAdjacentHTML('beforeend', rows.map(card).join(''));
    if (window.ztorIcons) window.ztorIcons.applyIcons(rail);
    var stat = document.getElementById('demo-stat');
    if (stat) {
      var ev = rows.filter(function (r) { return r.k === 'event'; }).length;
      stat.textContent = WINDOW_DAYS + ' 天內：即將發生 ' + rows.length + ' 件（項目 '
        + (rows.length - ev) + ' ／ 活動 ' + ev + '），接在進行中那幾件後面。';
    }
    if (window.applyI18n) { try { window.applyI18n(); } catch (e) {} }
    /* 輪播的位移是算出來的：卡片數量變了要它重新定位，最省的辦法是發一次 resize。 */
    window.dispatchEvent(new Event('resize'));
  }

  fill();
  /* 換語言會把這一列整段重畫（正式渲染器的行為），demo 的卡片要跟著補回去。 */
  document.addEventListener('i18n:applied', function () { setTimeout(fill, 0); });

  var note = document.getElementById('demo-note');
  note.querySelector('.demo-note__x').addEventListener('click', function () { note.remove(); });
  note.querySelectorAll('[data-win]').forEach(function (b) {
    b.addEventListener('click', function () {
      WINDOW_DAYS = +b.getAttribute('data-win');
      note.querySelectorAll('[data-win]').forEach(function (x) { x.classList.toggle('is-on', x === b); });
      fill();
    });
  });
})();
</script>
</body>
</html>
