<body class="canvas-home-shell" data-sheet-nav>
<div class="app">

  <header class="app-topbar" id="sidebar"></header>

  <main class="main">
    <div class="page">

      <!-- 第一屏（2026-08-31 使用者裁示「往下滑，內容要換」）：頂列＋大畫布固定佔滿
           一個視窗高度，往下才是換過內容的第二段。包一層 `.canvas-hero` 而不是讓
           `.page` 自己撐高——`.page` 現在要能往下長，一屏那件事得由自己的容器負責。 -->
      <div class="canvas-hero">
      <!-- 頂列與右緣的作品切換器包在同一層（2026-08-31 使用者裁示「他們應該同步往上
           滑不見」）：sticky 的元素是被自己容器的下緣推走的，時機取決於元素自己的
           高度——切換器 250px、頂列 46px，各自 sticky 一定不同步（實測捲到 860 時
           頂列還在 4、切換器已到 -139）。包成同一塊 sticky 之後整塊一起走。
           外面那層 `__stick` 決定它們什麼時候被推走（高度由 JS 算，見頁尾腳本）：
           使用者裁示「下一段一出現，這兩個就跟著往上滑掉」，而 sticky 的容器如果是
           整個第一屏，它們會一直釘到第一屏的最後一百多像素才走——那時第二段已經
           佔掉半個畫面了。 -->
      <div class="canvas-hero__stick" data-hero-stick>
      <div class="canvas-hero__chrome">
        <div class="canvas-home__bar">
          <div class="canvas-home__lead">
            <h1 class="canvas-home__title" id="canvas-greeting">Home</h1>
            <!-- 副標與正式儀表板同一句（`dash.sub`，2026-08-31 使用者裁示「加到問候
                 底下」）：兩頁講的是同一件事，這一句不另寫一份。 -->
            <p class="canvas-home__sub" data-i18n="dash.sub">The money coming in, what needs you, and where your work is being heard and seen.</p>
          </div>

            <span class="canvas-home__date" id="canvas-date"></span>
            <span class="canvas-home__sep" aria-hidden="true"></span>
            <span class="canvas-home__clock" id="canvas-clock">--:--</span>
          </div>
        </div>
        <!-- 作品切換器：獨立的渲染器，位置由 CSS 掛在頂列底下、貼右緣。 -->

      </div>
      </div><!-- /.canvas-hero__stick -->

      <!-- 舞台鋪滿整個內容區、壓在最底；左欄的字直接浮在它上面（不畫卡框），

      <div class="canvas-home">
        <div class="canvas-home__stage" data-component="canvas-stage"></div>

        <!-- 第二屏的地：正中央那一件的海報，糊掉（2026-08-31 使用者裁示「選到那個

             第二屏裡面：第二屏那一層有自己的 z-index，畫在裡面會蓋掉側欄；擺在第一屏

          <!-- 1 收入與粉絲組成，8 秒輪流 -->

          <!-- 2026-08-31 撤除（墓碑）：「上線進行中」那一格（`work-rows` ＋ `canvas-works`）。
               使用者重新定義第一屏要回答的三件事——錢與粉絲的狀況、必須做的待辦、
               接下來要進行哪些項目——而第三件已經由右緣的切換器承擔（它同時是底圖的

        <div class="canvas-home__overlay" data-component="canvas-overlay"></div>

      <!-- 往下捲的提示（2026-08-31 使用者裁示）：貼著第一屏的底、置中。
           位置的理由——左欄與右欄之間那道空隙的底端本來就是整屏最空的一塊，提示放在

           它是按鈕不只是裝飾：按下去就捲到第二屏，不必自己找滾輪。

      <button type="button" class="canvas-hint" data-scroll-hint>
        <span data-i18n="canvas.scroll.more">Scroll for more</span>
        <i data-lucide="chevron-down" class="ztor-icon" aria-hidden="true"></i>
      </button>
      </div><!-- /.canvas-hero -->

      <!-- ── 第二段：往下滑之後的內容（2026-08-31 使用者裁示把這兩區放出來）──
           平台表現的標記與資料與正式儀表板同一份（`[data-perf="dash"]` ＋
           performance-store），不另做一套：同一件事在兩頁各寫一份，遲早會有一頁沒跟上。
           進行中那一屏是這一頁自己的排法（`live-cards`），但資料仍走 projects／events
           兩支 store 的同一組口徑（見 components.js 的 `canvasRowsOf`）。 -->
      <div class="canvas-below">
        <!-- 第二段：進行中的項目與活動，自己佔一屏（2026-08-31 使用者裁示先「這個要
             自己佔一頁的篇幅」，再「換成進行中的項目募資、預購以及活動售票中」）。
             一次一張整的卡、右邊露出下一張的一半，右側三分之一留白給翻頁鈕——
             這一屏要回答的是「手上這幾件跑得怎麼樣」，看不完的按下一輪。
             「查看更多」在卡片下方，一屏只有一件事時出口該在讀完之後的位置。 -->
        <!-- 沒有區塊標題（2026-08-31 使用者裁示刪除）：這一屏只有一件事，而卡片上
             已經寫著它是什麼（募資／預購／售票中）；標題在這裡只是重複一次。 -->
        <section class="canvas-sheet canvas-sheet--live">
          <div data-component="live-cards" data-key="canvas-live"></div>
          <!-- 出口跟著正中央那一件走（2026-08-31 使用者裁示）：看的是項目就寫
               「查看更多項目」、落在項目清單；看的是活動就寫「查看更多活動」、
               落在活動清單。文字與去處都由輪播控制更新（components.js）。 -->
          <div class="canvas-sheet__foot">
            <a class="btn btn--primary btn--lg" href="projects.html" data-live-more>
              <span data-i18n="canvas.more.projects">More projects</span>
              <i data-lucide="chevron-right" class="ztor-icon" aria-hidden="true"></i>
            </a>
          </div>
        </section>

        <!-- 第三段：平台表現，同樣佔一屏，每一個類型一行（同日使用者裁示）。 -->
        <section class="canvas-sheet canvas-sheet--perf">
          <div class="bento" data-perf="dash"></div>
        </section>
      </div>
    </div>

<script>
/* 頂列的時間與今日進帳（2026-08-31）。
   時間每分鐘更新一次，不是每秒——展示版上一個跳秒的鐘會一直把目光拉過去，
   而它其實不帶任何要讀的資訊。 */
(function () {
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  function tick() {
    var el = document.getElementById('canvas-clock');
    if (!el) return;
    var d = new Date();
    el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 60000);

  /* 日期：與時間同一列（2026-08-31 使用者裁示頂列只留日期與時間）。
     兩個語言各寫各的格式，不是同一串的逐字對譯——中文「2026 年 8 月 31 日 · 週一」，
     英文 "Mon, 31 Aug 2026"。跟著語言切換重畫。 */
  function stamp() {
    var el = document.getElementById('canvas-date');
    if (!el) return;
    var zh = (document.documentElement.lang || '').toLowerCase().indexOf('zh') === 0;
    var d = new Date();
    el.textContent = zh
      ? d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · '
        + '週' + '日一二三四五六'.charAt(d.getDay())
      : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }
  stamp();
  /* i18n 發的事件是 `i18n:applied`；`ztor:langchange` 站上沒有任何地方發，
     掛在它上面等於沒掛（2026-08-31 修）。 */
  document.addEventListener('i18n:applied', stamp);



  /* 問候語與儀表板同一套（名字走 persona、招呼看時段）：兩個版型講同一句話，
     不要一個說 Home 一個說「午安，周湯豪」。 */
  function greet() {
    var el = document.getElementById('canvas-greeting');
    if (!el) return;
    var api = window.ztorProjects;
    var name = api && api.displayName ? api.displayName() : '';
    var zh = (document.documentElement.lang || '').toLowerCase().indexOf('zh') === 0;
    var h = new Date().getHours();
    var hi = zh ? (h < 12 ? '早安' : h < 18 ? '午安' : '晚安')
               : (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening');
    el.textContent = name ? (zh ? hi + '，' + name : hi + ', ' + name) : hi;
  }
  greet();
  document.addEventListener('DOMContentLoaded', greet);
  document.addEventListener('i18n:applied', greet);

  /* 捲過第一屏就把底圖淡掉（2026-08-31）：底圖是 `fixed` 的——它必須滿到視窗邊
     才讀得出「這張圖是地」——所以捲動時它不會自己離開。下面那一段是一般的工作
     內容（磚列、平台表現），躺在一張人臉上讀不乾淨；淡掉之後就回到站上原本的
     星空檯面，與其他頁一致。門檻取半屏：太早會在還看得到第一屏時就開始褪，
     太晚則會讓第二段的頭幾行仍疊在圖上。 */
  /* 捲動發生在 `.main` 身上、不是視窗：站上的外殼是固定高度的玻璃殼，
     內容在面板裡自己捲（shared.css 的 `.main { overflow-y: auto }`）。
     監聽掛在 window 上永遠不會觸發（2026-08-31 實測）。 */
  var scroller = document.querySelector('.main');
  var hero = document.querySelector('.canvas-hero');
  var rail = document.querySelector('.canvas-home__rail');
  var liveSheet = document.querySelector('.canvas-sheet--live');
  var FADE = 72;   /* 左欄上緣漸消的長度 */

  /* 頂列與切換器什麼時候被推走（2026-08-31 使用者裁示兩次：先「下一段出現時，
     這兩個也一起往上滑不見」，再「**在左欄那一塊滑走之前，頂列與右側都不要動**」）：
     sticky 的元素是被**自己容器的下緣**推走的，容器若是整個第一屏，它們會釘到
     第一屏剩下最後一個元素高度時才走——而第一屏比左欄還長（左欄結束之後還有一段
     空白），所以它們會在左欄早就捲完之後還壓在畫面上。
     解法是把它們包進一個容器，讓容器的**下緣切齊左欄的下緣**：左欄還在畫面上時
     它們一動不動，左欄的底邊一碰到畫面頂端，它們就跟著滑出去。
     容器多出來的高度用等量的負下外距抵銷，底下的內容位置完全不動；容器本身
     `pointer-events: none`（它會蓋到下面的內容上），只有裡面的頂列吃事件。
     **算一次就好**：高度只跟版面有關，不跟捲動有關——所以不放進 onScroll，
     避免又走回「JS 每一幀算位移」那條會抖的老路。 */
  var stick = document.querySelector('[data-hero-stick]');
  var chrome = document.querySelector('.canvas-hero__chrome');
  var stickH = null;
  function sizeStick() {
    if (!stick || !chrome || !rail || !scroller) return;
    /* 不必先把樣式清掉再量：這一層多出來的高度已經被等量的負下外距抵銷，
       左欄與容器量到的都是它們自己的自然位置。 */
    var y = scroller.scrollTop;
    var top = stick.getBoundingClientRect().top + y;
    var bottom = rail.getBoundingClientRect().bottom + y;
    var h = Math.max(Math.round(bottom - top), chrome.offsetHeight);
    /* 右邊那一排要在「頂列底下到左欄下緣」這一段裡垂直置中（2026-08-31 使用者裁示
       「這一整個是不是稍微往下移一點」）。它是相對頂列定位的，量得到自己下緣的
       只有這裡：把「頂列下緣到這一層下緣」的距離寫成變數，CSS 用它把框拉到底。 */
    stick.style.setProperty('--picks-span', (h - chrome.offsetHeight) + 'px');
    if (h === stickH) return;
    stickH = h;
    /* 這一層在版面上該佔的高度＝頂列自己的高 ＋ 頂列與工作區之間的間距。
       **那段間距要在這裡加回來**（2026-08-31 使用者回報「這兩個區域的間距要留出來」）：
       間距原本是頂列的下外距，而這一層一旦有了指定高度，子元素的下外距就不再穿透
       出來——56px 的呼吸整段消失，問候與第一格的標題會黏在一起。 */
    var bar = chrome.firstElementChild;
    var gapBelow = bar ? (parseFloat(getComputedStyle(bar).marginBottom) || 0) : 0;
    stick.style.height = h + 'px';
    stick.style.marginBottom = (chrome.offsetHeight + gapBelow - h) + 'px';
  }
  sizeStick();
  window.addEventListener('resize', sizeStick);
  window.addEventListener('load', sizeStick);
  /* 換語言／重畫之後左欄的高度會變（待辦筆數、字長都不同），第一屏跟著變高變矮。 */
  document.addEventListener('i18n:applied', function () { setTimeout(sizeStick, 0); });
  /* 第一屏的高度在載入後還會再變幾次（字型換好、圖載完、元件重畫），而它變了
     推走的時刻就跟著錯位——實測有一次算在 933、穩定後是 877，差了 56px。
     盯著它自己重算，比在每一個可能的時機各補一次呼叫可靠。 */
  if (window.ResizeObserver && rail) {
    /* 看的是左欄不是第一屏：左欄是決定第一屏高度的那一項，而第一屏的高度會被
       這支函式自己改動——盯著自己改的東西會來回觸發。 */
    new ResizeObserver(function () { sizeStick(); }).observe(rail);
  }

  function onScroll() {
    if (!scroller) return;
    var y = scroller.scrollTop;

    /* 1) 第一段快要走完時把底圖與切換器一起淡掉：它們是 `fixed`／sticky 的，
          不會自己離開，而第二段是一般的工作內容，躺在一張人臉上讀不乾淨。
          門檻改成「第一段的底邊剩下四分之一個螢幕」（2026-08-31 再調）：原本寫成
          固定的「半個螢幕」，第一段變長之後那個位置還在半路上——照片消失時左欄
          才捲到待辦事項，看起來像圖突然壞掉。 */
    var heroH = hero ? hero.offsetHeight : scroller.clientHeight;
    var fadeAt = Math.max(heroH - scroller.clientHeight * 0.25, scroller.clientHeight * 0.3);
    document.body.classList.toggle('is-past-hero', y > fadeAt);
    /* 一開始捲就把提示收掉：它的工作是「告訴你這一頁還有下面」，你一動它就完成了。 */
    document.body.classList.toggle('is-scrolled', y > 8);

    /* 1b) 第二段佔著畫面時，換上「正中央那一件的海報」當整個視窗的地
          （2026-08-31 使用者裁示；圖由 components.js 的輪播控制換，這裡只管開關）。
          判準是「這一段蓋住畫面的中線」：那一刻它已經是讀者在看的東西，而更早開燈
          會在第一屏還沒走完時就把地換掉。 */
    if (liveSheet) {
      var lr = liveSheet.getBoundingClientRect();
      var mid = scroller.clientHeight / 2;
      document.body.classList.toggle('is-live-bg', lr.top < mid && lr.bottom > mid);
    }

    /* 2) 右邊的作品切換器與頂列都改用 CSS sticky 釘住（2026-08-31 再調）：
          原本這裡用捲動事件即時算位移，JS 比瀏覽器的捲動繪製慢半拍所以會抖，
          而且與頂列（CSS sticky）由兩套機制驅動、離開的時機對不上。
          規則寫在 canvas-stage.css 的 `.canvas-stage__rail`，這裡不再插手。 */

    /* 3) 左欄往上捲時上緣漸消：遮罩是相對元素自己的框算的，而「畫面頂端現在切到
          這一欄的哪裡」只有捲動量知道，所以把兩個位置寫成變數餵給 CSS。
          **淡出的長度跟著捲動量長，不是固定 72**（2026-08-31 使用者回報「還沒開始
          滑就被遮住了」）：固定值在 `y = 0` 時就已經把最上面 72px 蓋掉一半，
          而那時根本還沒有東西捲出去。 */
    if (rail) {
      var fade = Math.min(y, FADE);
      rail.style.setProperty('--rail-fade-start', y + 'px');
      rail.style.setProperty('--rail-fade-end', (y + fade) + 'px');
    }
  }
  /* 提示鈕：按了就捲到第二屏。用 `scrollIntoView` 而不是自己算位移——那一段的位置
     會隨左欄長短變動，算出來的數字很快就過期。 */
  var hint = document.querySelector('[data-scroll-hint]');
  if (hint) hint.addEventListener('click', function () {
    var next = document.querySelector('.canvas-sheet');
    if (next) next.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  onScroll();
  if (scroller) scroller.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
})();
</script>
</body>
</html>
