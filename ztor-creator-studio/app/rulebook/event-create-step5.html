*{box-sizing:border-box}
body{
  font-family:"PingFang TC","Noto Sans TC","Heiti TC","Hiragino Sans CNS",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  margin:0; padding:32px 24px 64px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:24px;font-weight:500;margin:0 0 6px;letter-spacing:-0.01em}
h2{font-size:18px;font-weight:500;margin:40px 0 10px;padding-top:6px;letter-spacing:-0.005em}
h2 .n{display:inline-block;min-width:26px;color:var(--text-3);font-weight:400;font-variant-numeric:tabular-nums}
h3{font-size:14px;font-weight:500;margin:20px 0 6px;color:var(--text-2)}
p{margin:0 0 10px}
.lede{font-size:14px;color:var(--text-2);margin:0 0 4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
ul.plain,ol.plain{margin:4px 0 10px;padding-left:20px}
ul.plain li,ol.plain li{margin-bottom:4px}
ul.plain ul.plain,ol.plain ul.plain{margin:4px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--text-2);background:var(--surface-sunken);font-size:12.5px}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.k{font-size:12px;color:var(--text-3)}
.ex{margin:10px 0 6px;padding:11px 14px;border:1px solid var(--border);border-left:3px solid var(--wait-key);border-radius:var(--radius);background:var(--surface);font-size:13px}
.ex p{margin:0 0 4px}
.ex ul{margin:0;padding-left:18px}
.note{font-size:12.5px;color:var(--text-3);margin:6px 0 0}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);font-size:13px;color:var(--text-3)}
.foot ul{margin:8px 0 0;padding-left:20px}
.foot li{margin-bottom:5px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
/* 內文連結（章節互指） */
.wrap p a,.wrap li a,.wrap td a{color:inherit;text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.wrap p a:hover,.wrap li a:hover,.wrap td a:hover{text-decoration-color:var(--text-3);color:var(--text)}
