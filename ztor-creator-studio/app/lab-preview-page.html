<style>
  /* lab-preview-page — 預覽收進頂列按鈕的整頁示範（2026-10-28，使用者：「要把一整頁 demo 出來，包括上面的 header」）。
     header、卡片、底列都是建立商品頁的真元件（shared.css／ds-components）；只有預覽面板內的手機畫面是簡化示意。
     預覽不再站在右欄；頂列在儲存狀態鈕左邊多一顆「預覽」，按下從右側滑出（浮層）或把預覽欄推出來（並排，用右上的切換比較）。 */
  .lp-mode { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-md); box-shadow: 0 0 0 1px var(--border); margin-inline-end: var(--sp-8); }
  .lp-mode button { white-space: nowrap; border: 0; background: transparent; color: var(--muted-foreground); font: inherit; font-size: var(--fs-12); padding: 5px var(--sp-10, 10px); border-radius: var(--radius-sm, 6px); cursor: pointer; }
  .lp-mode button[aria-pressed="true"] { background: var(--ztu-glass-strong); color: var(--foreground); }
  .lp-pv { display: inline-flex; align-items: center; gap: var(--sp-6); }
  .lp-pv[aria-pressed="true"] { background: var(--ztu-glass-strong); }
  .lp-split { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-24); }
  .lp-split[data-mode="dock"][data-open="true"] { grid-template-columns: minmax(0, 1fr) 270px; }
  .lp-form { display: flex; flex-direction: column; gap: var(--sp-16); min-width: 0; }
  .lp-pane { display: none; }
  .lp-split[data-open="true"] .lp-pane { display: block; }
  .lp-split[data-mode="dock"] .lp-pane { position: sticky; top: var(--sp-16); align-self: start; }
  .lp-split[data-mode="drawer"] .lp-pane { position: fixed; top: 112px; right: var(--sp-24); bottom: 88px; width: 300px; padding: var(--sp-16); overflow: auto; z-index: 40;
    border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--surface-page); box-shadow: var(--shadow-card), var(--shadow-edge-top); animation: lp-in .22s ease-out; }
  @keyframes lp-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .lp-pane__head { display: flex; align-items: flex-start; justify-content: flex-end; margin-bottom: var(--sp-12); }
  .lp-pane__head h4 { margin: 0; font-size: var(--fs-14); font-weight: var(--fw-regular); }
  .lp-pane__head small { display: block; color: var(--muted-foreground); font-size: var(--fs-12); }
  .lp-x { border: 0; background: transparent; color: var(--muted-foreground); cursor: pointer; font-size: var(--fs-16); line-height: 1; padding: 4px 8px; border-radius: var(--radius-md); }
  .lp-x:hover { background: var(--ztu-glass-strong); color: var(--foreground); }
  .lp-phone { padding: 0; }   /* 內層不再自帶框：最外面的面板就是唯一的框（使用者：「這就是最外匡了」） */
  .lp-phone__img { aspect-ratio: 3 / 4; border-radius: var(--radius-lg); background: var(--ztu-film); display: grid; place-items: center; color: var(--muted-foreground); font-size: var(--fs-12); }
  .lp-phone__name { margin: var(--sp-12) 0 var(--sp-4); font-style: italic; color: var(--muted-foreground); font-size: var(--fs-18); }
  .lp-phone__price { color: var(--primary); font-size: var(--fs-16); margin-bottom: var(--sp-12); }
  .lp-phone__cta { height: 40px; border-radius: 999px; background: var(--foreground); color: var(--surface-page); display: grid; place-items: center; font-size: var(--fs-13); }

  /* 推開（使用者：「可以做一個滑入以後這樣排的」）：預覽變成貼右緣的整高欄，整個內容區（頂列膠囊＋表單）往左收窄讓位；
     頂列（含右端的「預覽」與儲存狀態鈕）留在原位，跟著內容區一起收窄，整高欄只放預覽面板。 */
  .lp-side { display: none; }
  /* 頁面捲軸不畫（使用者：「可以不要有這個」）：它夾在內容與預覽欄之間，把兩者看成分開的兩塊 */
  .wizard__sheet { scrollbar-width: none; }
  .wizard__sheet::-webkit-scrollbar { display: none; }
  .lp-push-on .wizard__bottom { right: 356px; transition: right .28s ease; }
  .lp-push-on .wizard__sheet { margin-right: 356px; transition: margin-right .28s ease; }
  .lp-push-on .lp-side { display: flex; flex-direction: column; gap: var(--sp-16); position: fixed; top: var(--sp-16); right: var(--sp-16); bottom: var(--sp-16); width: 340px; z-index: 40; animation: lp-in .28s ease-out; }
  .lp-mode--float { position: fixed; left: var(--sp-16); bottom: var(--sp-16); z-index: 60; margin: 0; background: var(--surface-page); box-shadow: 0 0 0 1px var(--border), var(--shadow-card); }
  .lp-side__pane { flex: 1; min-height: 0; overflow: auto; padding: var(--sp-16); border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--surface-page); box-shadow: var(--shadow-card), var(--shadow-edge-top); }   /* 底色用黑，同正式版 .fan-phone */
  .lp-split[data-mode="push"] .lp-pane { display: none !important; }
</style>
</head>
<body>
<div class="wizard">
  <div class="wizard__sheet wizard__sheet--sectioned">
  <header class="wizard__top">
    <div class="wizard__top-bar">
      <div class="wizard__top-lead">
        <button class="wizard__back" type="button" aria-label="返回"><i data-lucide="chevron-left" class="ztor-icon"></i></button>
        <div class="wizard__top-titlewrap">
          <span class="wizard__top-title">建立活動</span>
          <span class="wizard__top-sub">線下活動</span>
        </div>
      </div>
      <div class="wizard__progress">
        <div class="progress-stepper progress-stepper--segmented progress-stepper--anystep" style="--steps:6;--at:1;--progress:0%">
          <div class="progress-stepper__track"><div class="progress-stepper__fill"></div></div>
          <div class="progress-stepper__labels">
            <span class="progress-stepper__label progress-stepper__label--current"><span>基本資料</span><span class="progress-stepper__state">編輯中</span></span>
            <span class="progress-stepper__label"><span>場次</span><span class="progress-stepper__state">未完成</span></span>
            <span class="progress-stepper__label"><span>票種與票務</span><span class="progress-stepper__state">未完成</span></span>
            <span class="progress-stepper__label"><span>票務商品</span><span class="progress-stepper__state">未完成</span></span>
            <span class="progress-stepper__label"><span>發布設定</span><span class="progress-stepper__state">未完成</span></span>
            <span class="progress-stepper__label"><span>預覽與發布</span><span class="progress-stepper__state">未完成</span></span>
          </div>
        </div>
      </div>
      <div class="wizard__top-actions">
        <button class="wizard__save-status" type="button" data-wizard-save data-wizard-savedraft data-state="saved"><i class="wizard__save-status__dot"></i><svg class="wizard__save-status__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span data-wizard-save-text>已儲存</span><span class="wizard__save-status__hover">立即儲存</span></button>
        <button class="btn btn--outline btn--icon lp-pv" type="button" id="pv" aria-pressed="false" aria-controls="pane" aria-label="預覽" title="預覽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
  </header>

  <div class="wizard__body wizard__body--form wizard__body--mid">
    <div class="lp-split" id="split" data-mode="push" data-open="false">
      <div class="lp-form">
        <section class="form-section form-section--outlined">
          <div class="form-section__head"><h3 class="form-section__title">商品資訊</h3></div>
          <div class="field"><label class="field__label">商品名稱 <span class="field__req">*</span></label><input class="input" placeholder="例：Summer Tour Hoodie"></div>
          <div class="field"><label class="field__label">告訴粉絲他們會拿到什麼 <span class="field__req">*</span></label><textarea class="input" rows="4" placeholder="描述你的商品…"></textarea></div>
          <div class="field"><label class="field__label">實體分類</label><input class="input" value="服飾配件"></div>
        </section>
        <section class="form-section form-section--outlined">
          <div class="form-section__head"><h3 class="form-section__title">規格詳情</h3></div>
          <div class="field"><label class="field__label">主分類</label><input class="input" placeholder="請選擇"></div>
          <div class="field"><label class="field__label">次分類</label><input class="input" placeholder="請選擇"></div>
          <div class="field"><label class="field__label">適用對象</label><input class="input" placeholder="請選擇"></div>
        </section>
        <section class="form-section form-section--outlined">
          <div class="form-section__head"><h3 class="form-section__title">商品圖片</h3></div>
          <div class="field"><input class="input" placeholder="拖曳或選擇圖片"></div>
        </section>
      </div>
      <aside class="lp-pane" id="pane" aria-label="商品預覽">
        <div class="lp-pane__head"><button class="lp-x" type="button" id="x" aria-label="關閉預覽">✕</button></div>
        <div class="lp-phone">
          <div class="lp-phone__img">商品圖片</div>
          <div class="lp-phone__name">商品名稱</div>
          <div class="lp-phone__price">NT$ 0</div>
          <div class="lp-phone__cta">加入購物車</div>
        </div>
      </aside>
    </div>
  </div>
  </div>

  <div class="lp-mode lp-mode--float" role="group" aria-label="預覽打開方式（比較用）"><button type="button" data-mode="push" aria-pressed="true">推開</button><button type="button" data-mode="drawer" aria-pressed="false">浮層</button><button type="button" data-mode="dock" aria-pressed="false">並排</button></div>
  <div class="lp-side" id="side"><div class="lp-side__pane" id="sidePane"></div></div>
  <footer class="wizard__bottom wizard__bottom--end">
    <div class="wizard__bottom-actions"><button class="btn btn--primary" type="button">下一步</button></div>
  </footer>
</div>
<script src="js/lucide.min.js?v=r2.2" onerror="void 0"></script>
<script>
(function () {
  var sp = document.getElementById('split'), pv = document.getElementById('pv');
  var side = document.getElementById('side'), sidePane = document.getElementById('sidePane'), pane = document.getElementById('pane');
  function layout() {
    var push = sp.dataset.mode === 'push' && sp.dataset.open === 'true';
    document.querySelector('.wizard').classList.toggle('lp-push-on', push);
    sidePane.innerHTML = push ? pane.innerHTML : '';
  }
  function open(v) { sp.dataset.open = String(v); pv.setAttribute('aria-pressed', String(v)); layout(); }
  pv.addEventListener('click', function () { open(sp.dataset.open !== 'true'); });
  document.addEventListener('click', function (e) { if (e.target.closest('.lp-x')) open(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') open(false); });
  document.querySelectorAll('.lp-mode button').forEach(function (b) {
    b.addEventListener('click', function () {
      var was = sp.dataset.open === 'true'; open(false); sp.dataset.mode = b.dataset.mode; if (was) open(true);
      document.querySelectorAll('.lp-mode button').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    });
  });
})();
</script>
<script src="js/i18n.js?v=r2.2"></script>
