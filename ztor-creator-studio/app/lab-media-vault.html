<style>
  /* lab-media-vault — 媒體庫 UX 改版 demo（2026-10-29）。不改正式頁 media-vault.html；
     只用既有元件，自有樣式一律 lab- 前綴＋token。規劃文件：note/媒體庫UX重新規劃.md。
     結構：庫房列（橫向）→ 庫房標頭 → 檢查表 → 設定｜成效 →
     左欄兩道門（第一道：誰進得來；第二道：進來後看得到哪幾件），右欄常駐「粉絲看到的樣子」。 */
  .lab [hidden] { display: none !important; }
  .lab-note { font-size: var(--fs-12); color: var(--muted-foreground); }
  .lab-num { font-family: var(--font-numeric); font-variant-numeric: tabular-nums; }


  /* ── 庫房列 ── */
  .lab-shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: var(--sp-24); align-items: start; margin-top: var(--sp-16); }
  .lab-stage { min-width: 0; }
  .lab-rail { position: sticky; top: var(--sp-16); display: grid; gap: var(--sp-10); max-height: calc(100dvh - var(--sp-32)); grid-template-rows: auto minmax(0, 1fr); }
  .lab-rail__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-8); }
  .lab-rail__title { font-size: var(--fs-14); font-weight: var(--fw-semibold); }
  .lab-strip { display: grid; gap: var(--sp-6); align-content: start; overflow-y: auto; padding: var(--sp-2); }
  /* 庫房列表的一列：無框，狀態靠底色說話 —— 預設透明、滑過 --accent、選中淡橘底（--selected-surface）、上鎖變淡 */
  .lab-vcard { width: 100%; display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: var(--sp-12); align-items: center; text-align: left; padding: var(--sp-8) var(--sp-10); border: 0; border-radius: var(--radius-lg); background: transparent; color: var(--foreground); cursor: pointer; font: inherit; transition: background-color var(--duration) var(--easing); }
  .lab-vcard:hover { background: var(--accent); }
  .lab-vcard:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ring); }
  .lab-vcard--active, .lab-vcard--active:hover { background: var(--selected-surface); }
  .lab-vcard--active:hover { background: var(--selected-surface-hover); }
  .lab-vcard--dim { opacity: .55; }
  .lab-vcard__cover { width: 2.75rem; aspect-ratio: var(--img-portrait); border-radius: var(--radius-sm); background: var(--ztu-film) center/cover no-repeat; display: grid; place-items: center; color: var(--muted-foreground); }
  .lab-vcard__text { display: grid; gap: var(--sp-4); min-width: 0; }
  .lab-vcard__name { font-size: var(--fs-14); font-weight: var(--fw-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab-vcard--active .lab-vcard__name { color: var(--selected-ink); }
  .lab-vcard__meta { display: flex; align-items: center; gap: var(--sp-6); font-size: var(--fs-12); color: var(--muted-foreground); min-width: 0; white-space: nowrap; }
  .lab-vcard__st { display: inline-flex; align-items: center; gap: var(--sp-4); }
  .lab-vcard__dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }
  .lab-vcard__st--listed { color: var(--status-success-ink); }
  .lab-vcard__st--unlisted { color: var(--status-warning-ink); }
  .lab-vcard__st--draft .lab-vcard__dot { background: transparent; box-shadow: 0 0 0 1px currentColor inset; }
  .lab-vcard--new { box-shadow: 0 0 0 1px var(--border) inset; color: var(--muted-foreground); }   /* 同樣的列，外框改細線，標示這是動作 */
  .lab-vcard--new .lab-vcard__name { color: var(--foreground-muted); font-weight: var(--fw-regular); }
  .lab-vcard--new .lab-vcard__cover { background: transparent; border: 1px dashed var(--border); }
  .lab-vcard--new:hover { color: var(--foreground); }
  .lab-vcard--new:hover .lab-vcard__name { color: var(--foreground); }
  .lab-vcard__sep { color: var(--faint-ink); }

  /* ── 工作區 ── */
  .lab-work { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-24); align-items: start; }
  .lab-work--wide { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 900px) { .lab-shell { grid-template-columns: minmax(0, 1fr); } .lab-rail { position: static; max-height: none; } .lab-strip { grid-auto-flow: column; grid-auto-columns: 13.5rem; overflow-x: auto; } }
  .lab-main { display: grid; gap: var(--sp-16); min-width: 0; }
  .lab-side { position: sticky; top: var(--sp-16); display: grid; gap: var(--sp-12); }

  /* 標頭 */
  .lab-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-16); }
  .lab-head__title { display: flex; align-items: center; gap: var(--sp-8); flex-wrap: nowrap; min-width: 0; height: 34px; }   /* 固定一行高度，讀取態與改名態同高 */
  .lab-head__title .badge { flex-shrink: 0; }
  .lab-head__name { font-size: var(--fs-22); font-weight: var(--fw-semibold); line-height: var(--lh-snug); background: none; border: 0; color: var(--foreground); padding: 0; cursor: text; font-family: var(--font-display); text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lab-head__name:hover { text-decoration: underline dotted; text-underline-offset: 4px; }
  /* 改名中的輸入框：字級、字重、行高與名稱完全相同，高度鎖成名稱那一行，文字不位移、旁邊的狀態徽章不換行；
     寬度由 JS 依字量出來，輸入時跟著長 */
  .lab-head__nameinput { height: 34px; padding: 0 var(--sp-10); margin-inline: calc(-1 * (var(--sp-10) + 1px)); font-size: var(--fs-22); font-weight: var(--fw-semibold); font-family: var(--font-display); line-height: var(--lh-snug); min-width: 6rem; max-width: 100%; box-sizing: content-box; }
  .lab-head__actions { display: flex; align-items: center; gap: var(--sp-8); flex-shrink: 0; position: relative; }
  .lab-menu { position: absolute; right: 0; top: calc(100% + var(--sp-6)); z-index: 20; min-width: 13rem; padding: var(--sp-6); border-radius: var(--radius-lg); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-overlay); display: grid; gap: var(--sp-2); }
  .lab-menu__item { display: flex; align-items: center; gap: var(--sp-8); width: 100%; padding: var(--sp-8) var(--sp-10); border: 0; background: none; color: var(--foreground); font: inherit; font-size: var(--fs-13); text-align: left; border-radius: var(--radius-sm); cursor: pointer; }
  .lab-menu__item:hover { background: var(--accent); }
  .lab-menu__item[disabled] { color: var(--faint-ink); cursor: not-allowed; background: none; }
  .lab-menu__item--danger { color: var(--destructive-ink); }
  .lab-menu__hint { font-size: var(--fs-12); color: var(--muted-foreground); padding: 0 var(--sp-10) var(--sp-6); }


  /* 門（區段） */
  .lab-gate { display: grid; gap: var(--sp-14); }
  .lab-gate__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-12); }
  .lab-gate__eyebrow { font-size: var(--fs-12); color: var(--brand-ink); letter-spacing: .04em; }
  .lab-gate__title { font-size: var(--fs-18); font-weight: var(--fw-semibold); margin-top: var(--sp-2); }
  @media (max-width: 640px) { .lab-head { flex-direction: column; } }
  .lab-gate__sub { font-size: var(--fs-12); color: var(--muted-foreground); margin-top: var(--sp-4); }

  /* 開啟方式：兩種並排當兄弟（條件開啟｜鑰匙開啟），一張卡裡兩欄；窄於 900 疊成一欄 */
  .lab-open { display: grid; gap: var(--sp-14); padding: var(--sp-18) var(--sp-20); border-radius: var(--radius-xl); border: 1px solid var(--layer-line); background: var(--layer-1-surface); }
  .lab-open__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-8); }
  .lab-open__tabs { margin-bottom: 0; flex: 1; }
  .lab-way { display: grid; gap: var(--sp-12); align-content: start; min-width: 0; }
  .lab-way__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-12); }
  .lab-way__n { font-size: var(--fs-12); color: var(--muted-foreground); }
  .lab-way__hdr-r { display: inline-flex; align-items: center; gap: var(--sp-8); }
  [data-modal] { z-index: 260; }   /* 抽屜是 200，撤銷確認、發布彈窗要疊在它上面 */
  .lab-way__desc { margin: 0; font-size: var(--fs-12); color: var(--muted-foreground); }
  .lab-way__list { display: grid; gap: var(--sp-10); }
  .lab-way__item { display: grid; gap: var(--sp-8); }
  .lab-way__item-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-8); }
  .lab-way__item-name { font-size: var(--fs-13); font-weight: var(--fw-medium); }
  .lab-way__item-n { font-size: var(--fs-12); color: var(--muted-foreground); }
  .lab-way__item-n--zero { color: var(--status-warning-ink); }
  .lab-way__more { justify-self: start; }
  .lab-way__empty { display: grid; justify-items: start; gap: var(--sp-10); padding: var(--sp-8) 0; }
  .lab-way__empty p { margin: 0; font-size: var(--fs-13); color: var(--muted-foreground); }
  .lab-way__actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-8); }
  .lab-way__manage { margin-left: auto; }
  .lab-way__note { margin: 0; font-size: var(--fs-12); color: var(--muted-foreground); }
  .lab-key { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: var(--sp-10); align-items: center; padding: var(--sp-8) 0; border-top: 1px solid var(--border-soft); }
  .lab-key:first-child { border-top: 0; padding-top: 0; }
  .lab-key--revoked { opacity: .55; }
  .lab-key__main { display: grid; min-width: 0; }
  .lab-key__code { font-family: var(--font-mono); font-size: var(--fs-13); }
  .lab-key__label { font-size: var(--fs-12); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab-key__uses { font-size: var(--fs-12); color: var(--muted-foreground); white-space: nowrap; }
  /* 加條件選單 */
  .lab-pop { position: fixed; z-index: 75; width: 19rem; max-height: 24rem; overflow: auto; padding: var(--sp-8); border-radius: var(--radius-lg); background: var(--popover); border: 1px solid var(--border); box-shadow: var(--shadow-overlay); }
  .lab-pop__g { font-size: var(--fs-11); color: var(--muted-foreground); padding: var(--sp-8) var(--sp-8) var(--sp-4); letter-spacing: .04em; }
  .lab-pop__i { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); width: 100%; padding: var(--sp-8); border: 0; background: none; color: var(--foreground); font: inherit; font-size: var(--fs-13); border-radius: var(--radius-sm); cursor: pointer; text-align: left; }
  .lab-pop__i:hover { background: var(--accent); }
  .lab-pop__i[disabled] { color: var(--faint-ink); cursor: not-allowed; background: none; }
  .lab-pop__c { font-size: var(--fs-12); color: var(--muted-foreground); }

  /* 內容清單 */

  /* ── 右欄：粉絲看到的樣子 ── */
  .lab-pv__lens { display: grid; gap: var(--sp-8); }
  .lab-pv__tiers { display: flex; flex-wrap: wrap; gap: var(--sp-6); }
  .lab-phone { border-radius: var(--radius-xl); border: 1px solid var(--layer-line); background: var(--surface-preview); overflow: hidden; }
  .lab-phone__cover { height: 6.5rem; background: var(--ztu-film) center/cover no-repeat; position: relative; }
  .lab-phone__cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--scrim-media)); }
  .lab-phone__ribbon { position: absolute; z-index: 1; left: var(--sp-10); top: var(--sp-10); }
  .lab-phone__body { padding: var(--sp-12); display: grid; gap: var(--sp-10); color: var(--on-media); }
  .lab-phone__name { font-size: var(--fs-16); font-weight: var(--fw-semibold); margin-top: calc(-1 * var(--sp-28)); position: relative; z-index: 1; }
  .lab-phone__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-6); }
  .lab-tile { position: relative; aspect-ratio: var(--img-portrait); border-radius: var(--radius-sm); background: var(--ztu-film) center/cover no-repeat; overflow: hidden; display: grid; place-items: center; color: var(--on-media-muted); }
  .lab-tile--veil::before { content: ""; position: absolute; inset: 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: var(--overlay-tint); }
  .lab-tile__tag { position: absolute; left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-4); z-index: 1; font-size: var(--fs-11); line-height: var(--lh-tight); color: var(--on-media); text-align: center; }
  .lab-tile__ico { position: relative; z-index: 1; }
  .lab-tile__star { position: absolute; top: var(--sp-4); right: var(--sp-4); z-index: 1; color: var(--ztu-orange-hi); }
  .lab-lock { display: grid; gap: var(--sp-8); padding: var(--sp-12); border-radius: var(--radius-md); background: var(--overlay-tint); font-size: var(--fs-12); color: var(--on-media-muted); }
  .lab-lock__t { display: flex; align-items: center; gap: var(--sp-6); font-size: var(--fs-14); color: var(--on-media); font-weight: var(--fw-medium); }
  .lab-lock__route { padding-left: var(--sp-10); border-left: 2px solid var(--border); color: var(--on-media); }


  /* 彈窗內 */
  .lab-dlg { display: grid; gap: var(--sp-14); }
  /* 抽屜預覽改直式 2:3（2026-11-02 使用者：「這個要直的」）：只在 demo 頁用 lab- 類別覆寫，定案後再改進 media-preview.css */
  .mpreview--image.lab-portrait { aspect-ratio: 1 / 1; justify-content: center; }   /* 方形外框，直式圖放在裡面（2026-11-02 使用者） */
  .mpreview.lab-portrait .mpreview__stage { aspect-ratio: var(--img-portrait); width: min(100%, 15rem); max-height: none; min-height: 0; margin-inline: auto; }
  .mpreview.lab-portrait .mpreview__stage img { object-fit: cover; max-height: none; height: 100%; }
  .lab-dlg__foot { display: flex; justify-content: space-between; gap: var(--sp-8); align-items: center; padding-top: var(--sp-4); }
  .lab-dlg__btns { display: flex; gap: var(--sp-8); margin-left: auto; }
  .lab-list { display: grid; gap: var(--sp-6); font-size: var(--fs-13); padding-left: var(--sp-18); }
  .lab-fans { display: grid; gap: var(--sp-2); max-height: 12rem; overflow: auto; }
  .lab-fan { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); width: 100%; padding: var(--sp-6) var(--sp-8); border: 0; background: none; color: var(--foreground); font: inherit; font-size: var(--fs-13); border-radius: var(--radius-sm); cursor: pointer; text-align: left; }
  .lab-fan:hover { background: var(--accent); }
  .lab-fan__t { font-size: var(--fs-12); color: var(--muted-foreground); }

  /* 成效（頁首下方） */
  .lab-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-8); }
  .lab-stat { padding: var(--sp-14) var(--sp-16); border-radius: var(--radius-xl); background: var(--layer-1-surface); border: 1px solid var(--layer-line); }
  .lab-stat__v { font-size: var(--fs-24); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
  .lab-stat__of { font-size: var(--fs-13); color: var(--muted-foreground); font-weight: var(--fw-regular); }
  .lab-stat__l { font-size: var(--fs-13); margin-top: var(--sp-4); }
  .lab-stat__s { font-size: var(--fs-12); color: var(--muted-foreground); margin-top: var(--sp-2); }

  /* 內容卡片（橫排） */
  /* 灰底容器＋固定三欄卡片（照使用者線框 2026-11-02） */
  .lab-pool { display: grid; gap: var(--sp-16); padding: var(--sp-20); border-radius: var(--radius-xl); background: var(--layer-2-surface); border: 1px solid var(--layer-line); }
  .lab-mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-16); }
  @media (max-width: 640px) { .lab-mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .lab-mcard { display: grid; grid-template-rows: auto 1fr; border-radius: var(--radius-lg); border: 1px solid var(--layer-line); background: var(--layer-1-surface); overflow: hidden; cursor: pointer; transition: box-shadow var(--duration) var(--easing), border-color var(--duration) var(--easing); }
  .lab-mcard:hover { box-shadow: var(--shadow-float); }
  .lab-mcard__thumb { position: relative; aspect-ratio: var(--img-portrait); background: var(--ztu-film) center/cover no-repeat; display: grid; place-items: center; color: var(--muted-foreground); }
  .lab-mcard__dur { position: absolute; right: var(--sp-8); bottom: var(--sp-8); display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-6); border-radius: var(--radius-sm); background: var(--scrim-media); color: var(--on-media); font-size: var(--fs-11); }
  .lab-mcard__body { display: grid; gap: var(--sp-6); align-content: start; padding: var(--sp-10) var(--sp-12) var(--sp-12); min-width: 0; }
  .lab-mcard__name { font-size: var(--fs-14); font-weight: var(--fw-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab-mcard__line { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-8); font-size: var(--fs-12); color: var(--muted-foreground); min-width: 0; }
  .lab-mcard__task { display: inline-flex; align-items: center; gap: var(--sp-4); min-width: 0; }
  .lab-mcard__task--set { color: var(--foreground); }
  .lab-mcard__task--warn { color: var(--status-warning-ink); }
  .lab-mcard__task-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab-mcard__n { display: inline-flex; align-items: center; gap: var(--sp-4); flex-shrink: 0; }
  .lab-mcard__grand { position: absolute; top: var(--sp-8); right: var(--sp-8); display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: var(--radius-pill); background: var(--scrim-media); color: var(--ztu-orange-hi); }
  .lab-mcard--add { border-style: dashed; background: transparent; color: var(--muted-foreground); }
  .lab-mcard--add .lab-mcard__thumb { background: transparent; }
  .lab-mcard--add .lab-mcard__name { color: var(--muted-foreground); font-weight: var(--fw-regular); }
  .lab-mcard--add:hover, .lab-mcard--add.lab-drop--over { background: var(--accent); color: var(--foreground); }

  /* 新增庫房：全畫面建立流程（版型照 create-project／create-event 的 .wizard），蓋在頁面上 */
  .lab-wizlayer { position: fixed; inset: 0; z-index: 70; }
  .lab-wiz-open body { overflow: hidden; }
</style>
</head>
<body>
<div class="app">
  <header class="app-topbar" id="sidebar"></header>
  <main class="main">
    <div class="page lab" id="lab">

      <div class="page-crumb">
        <a href="media-vault.html" class="card__link">媒體庫（現行版）</a>
        <span style="margin:0 6px">/</span>
        <span>改版 demo</span>
      </div>

      <div class="page-intro">
        <div>
          <h1 class="page-intro__title">媒體庫</h1>
          <div class="page-intro__lede"><p class="page-intro__sub">開幾座庫房，決定誰進得來，再決定進來後每件內容要做什麼才看得到。</p></div>
        </div>
      </div>

      <div class="lab-shell">
      <!-- 庫房列表（F1）：左側欄（2026-10-30 使用者：「庫房列表可以是在左右側欄」），新增庫房在最上面 -->
      <aside class="lab-rail" aria-label="庫房">
        <div class="lab-rail__head"><span class="lab-rail__title">庫房</span></div>
        <div class="lab-strip" data-strip></div>
      </aside>
      <div class="lab-stage">

      <!-- 沒有任何庫房 -->
      <div class="empty-card empty-card--framed" data-none hidden>
        <span class="empty-card__icon empty-card__icon--primary"><i data-lucide="archive" class="ztor-icon"></i></span>
        <p class="empty-card__title">還沒有庫房</p>
        <p class="empty-card__text">庫房是放獨家照片、影片、音檔的地方。先取個名字，接著決定誰進得來。</p>
        <button class="btn btn--primary empty-card__cta" type="button" data-act="new-vault"><i data-lucide="plus" class="ztor-icon"></i>建立第一座庫房</button>
      </div>

      <div class="lab-work" data-work>
        <div class="lab-main">
          <!-- 標頭（F10） -->
          <div class="lab-head" data-head></div>

          <!-- 成效放最上面（2026-10-30 使用者），取代原本「設定｜成效」切換 -->
          <div class="lab-stats" data-stats></div>

          <!-- 照建立順序：先放內容，再設誰開得了（2026-10-30 使用者） -->
          <div data-pane="setup" class="lab-main">
            <section class="lab-pool" id="sec-content" data-gate2></section>
            <div id="sec-access" data-gate1></div>
          </div>

        </div>

      </div>
      </div>
      </div>
    </div>
  </main>
</div>

<input type="file" accept="image/*,video/*,audio/*" multiple hidden data-file>
<div class="lab-pop" data-pop hidden></div>

<!-- 新增庫房：取名 → 放內容 → 誰開得了（2026-10-30 使用者：「原本的 stepper 可以留著，參考創建流程」） -->
<div class="wizard lab-wizlayer lab" data-wiz hidden>
  <div class="wizard__sheet wizard__sheet--sectioned">
    <header class="wizard__top">
      <div class="wizard__top-bar">
        <div class="wizard__top-lead">
          <button class="wizard__back" type="button" data-act="wiz-exit" aria-label="返回媒體庫"><i data-lucide="chevron-left" class="ztor-icon"></i></button>
          <div class="wizard__top-titlewrap">
            <span class="wizard__top-title">建立庫房</span>
            <span class="wizard__top-sub" data-wiz-sub>新庫房</span>
          </div>
        </div>
        <div class="wizard__progress" data-wiz-progress></div>
        <div class="wizard__top-actions">
          <span class="wizard__save-status" data-state="saved" data-wiz-saved hidden><i class="wizard__save-status__dot"></i><span>已存成草稿</span></span>
        </div>
      </div>
    </header>
    <div class="wizard__body wizard__body--form wizard__body--narrow" data-wiz-body-wrap></div>
  </div>
  <footer class="wizard__bottom wizard__bottom--end">
    <div class="wizard__bottom-actions" data-wiz-foot></div>
  </footer>
</div>

<!-- 「條件開放怎麼算」說明（原型原本的 ⓘ） -->
<div class="explain" id="explain-vault-rules" hidden>
  <div class="explain__dialog" role="dialog" aria-modal="true" aria-labelledby="explain-vault-rules-title">
    <div class="explain__head">
      <h2 class="explain__title" id="explain-vault-rules-title">條件開放怎麼算</h2>
      <button class="explain__close" type="button" aria-label="關閉"><i data-lucide="x" class="ztor-icon"></i></button>
    </div>
    <div class="explain__body">
      <p class="explain__lead">每一種方法裡的條件要一起達成；方法與方法之間，達成任一種就進得來。</p>
      <p>粉絲一達到分級條件的那個等級就算符合；掉級會先進入緩衝倒數，緩衝結束後下一次每週重算仍不足才生效。</p>
    </div>
  </div>
</div>

<!-- 管理鑰匙：原型原本的分享抽屜（z-index 比彈窗高，所以撤銷確認彈窗另外抬高，見 [data-modal]） -->
<div class="drawer" data-share-drawer aria-hidden="true">
  <div class="drawer__scrim" data-act="share-close"></div>
  <section class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="vshare-title">
    <div class="drawer__head">
      <h2 class="drawer__title" id="vshare-title" data-share-title>管理鑰匙</h2>
      <button class="drawer__close" type="button" data-act="share-close" aria-label="關閉"><i data-lucide="x" class="ztor-icon"></i></button>
    </div>
    <div class="drawer__body" data-share-body></div>
  </section>
</div>

<!-- 單件設定：原型原本的右側抽屜（2026-11-02 使用者：「改回原本原型的」） -->
<aside class="drawer vault-item" data-item-sheet aria-hidden="true">
  <div class="drawer__scrim" data-act="item-close"></div>
  <div class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="vault-item-title">
    <div class="drawer__head">
      <h3 class="drawer__title" id="vault-item-title">內容設定</h3>
      <button type="button" class="drawer__close" data-act="item-close" aria-label="關閉"><i data-lucide="x" class="ztor-icon"></i></button>
    </div>
    <div class="drawer__body" data-item-body></div>
  </div>
</aside>

<div class="payout-modal" data-modal hidden>
  <section class="payout-dialog payout-dialog--narrow" role="dialog" aria-modal="true" aria-labelledby="lab-dlg-title">
    <div class="payout-dialog__head">
      <h2 class="payout-dialog__title" id="lab-dlg-title" data-modal-title></h2>
      <button class="btn btn--icon" type="button" data-act="modal-close" aria-label="關閉"><i data-lucide="x" class="ztor-icon"></i></button>
    </div>
    <div class="payout-dialog__body" data-modal-body></div>
  </section>
</div>

<script src="js/icons.js?v=r2.2"></script>
<script src="js/i18n.js?v=r2.2"></script>
<script src="js/toast.js?v=r2.2"></script>
<script src="js/explainer.js?v=r2.2"></script>
<script src="js/sidebar.js?v=r2.2"></script>
<script src="js/devtools.js?v=r2.2"></script>
<script src="js/lab-media-vault.js?v=r2.2"></script>
</body>
</html>
