<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit event has moved · Ztor Creator Studio</title>
<script src="js/theme.js?v=r2.2"></script>
<link rel="stylesheet" href="ds-components/_tokens.css?v=r2.2">
<link rel="stylesheet" href="ds-components/fonts.css?v=r2.2">
<link rel="stylesheet" href="ds-components/button.css?v=r2.2">
<link rel="stylesheet" href="ds-components/empty-stub.css?v=r2.2">
<link rel="stylesheet" href="shared.css?v=r2.2">
</head>
<!--
  ══ 墓碑（2026-08-06）══════════════════════════════════════════════════
  獨立的「編輯活動」頁已撤除，編輯搬進活動詳情頁（event-detail.html）就地進行：
  總覽與票種兩個分頁可切換 data-mode="view"/"edit"，做法沿用項目詳情頁 2026-07-27
  已裁決的那套。系列的共用設定改在系列母頁（series-detail.html）。

  為什麼是整頁換成導引、不是留著舊編輯器：兩個地方可以改同一份資料，之後一定會漂
  ——這個 repo 反覆踩過的坑。留一頁導引是給還存著舊網址或舊書籤的人一個明確去處，
  不是保留第二套實作。

  站上已無任何連結指向本頁（活動清單 14 個 ⋮、系列母頁 3 個都已改指詳情頁）。
  規格書的產品地圖 §3.2 仍列有本頁，屬上游動作，見 ASSUMPTIONS EDIT-001。
  舊實作可在 git 歷史取回：git show <2026-08-06 之前的 commit>:r2.2/edit-event.html
  ══════════════════════════════════════════════════════════════════════
-->
<body>
<div class="app">
  <header class="app-topbar" id="sidebar"></header>
  <main class="main">
    <div class="page">
      <div class="empty-stub"><div class="empty-stub__inner">
        <div class="empty-stub__mark">→</div>
        <h2 class="empty-stub__title" data-i18n="ee.moved.title">Editing moved to the event page</h2>
        <p class="empty-stub__sub" data-i18n="ee.moved.sub">Open the event and press Edit — the details and ticket tiers are edited right there. Settings shared across a series are edited on the series page.</p>
        <div class="empty-stub__refs">
          <a class="btn btn--primary" id="ee-moved-go" href="events.html" data-i18n="ee.moved.go">Open it</a>
        </div>
      </div></div>
    </div>
  </main>
</div>
<script src="js/icons.js?v=r2.2"></script>
<script src="js/i18n.js?v=r2.2"></script>
<script src="js/sidebar.js?v=r2.2"></script>
<script>
  /* 帶著 ?id= 進來的舊連結直接送到那一場的詳情頁，不要求使用者自己再找一次。 */
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    var go = document.getElementById('ee-moved-go');
    if (id && go) go.href = 'event-detail.html?id=' + encodeURIComponent(id);
  })();
</script>
</body>
</html>
